name: paper

# Weekdays at 12:30 UTC: before the US open in both EST and EDT, so market-on-open
# orders match the backtest's next-open execution. The ledger commit is the track record.
on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan orders without sending them"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  rebalance:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - name: Check for Alpaca paper keys
        id: keys
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "::warning::Set ALPACA_API_KEY and ALPACA_SECRET_KEY repo secrets to enable paper trading."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.keys.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - run: pip install -e .
        if: steps.keys.outputs.enabled == 'true'
      - name: Rebalance
        if: steps.keys.outputs.enabled == 'true'
        run: python -m lodestar paper ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit ledger
        if: steps.keys.outputs.enabled == 'true'
        run: |
          git config user.name "lodestar-bot"
          git config user.email "lodestar-bot@users.noreply.github.com"
          git add paper/ledger
          git diff --cached --quiet && exit 0
          git commit -m "paper: ledger $(date -u +%F)"
          git push
