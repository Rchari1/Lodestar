[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lodestar"
version = "0.1.0"
description = "AI-native research fund: an agent discovers daily ETF strategies, a locked harness scores them, Alpaca paper trades the winners."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "alpaca-py>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["lodestar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
